<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
<title>업무관리</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>업무관리</h1>
  <div id="due-summary" class="due-summary" aria-live="polite"></div>

  <form id="add-form" class="add-form" autocomplete="off">
    <input id="assignee-input" name="assignee" list="assignee-list" placeholder="담당자" />
    <input id="task-input" name="task" placeholder="업무 내용" />
    <input id="date-input" name="date" type="date" />
    <button type="submit">추가</button>
    <datalist id="assignee-list"></datalist>
  </form>

  <div class="filter-row">
    <input id="search-input" type="search" placeholder="업무명·담당자 검색" />
    <button type="button" id="export-csv">CSV 내보내기</button>
    <button type="button" id="restore-backup">백업 복원</button>
  </div>
  <div class="filter-row">
    <span class="filter-label">상태:</span>
    <div id="status-filter" class="filter-group">
      <button type="button" data-status="all" class="active">전체</button>
      <button type="button" data-status="incomplete">미완료</button>
      <button type="button" data-status="completed">완료</button>
    </div>
  </div>
  <div class="filter-row">
    <span class="filter-label">담당자:</span>
    <div id="assignee-filter" class="filter-group">
      <button type="button" data-assignee="all" class="active">전체</button>
    </div>
  </div>

  <div id="empty-message" class="empty-message" hidden></div>
  <table id="task-table" class="task-table">
    <tbody id="task-body"></tbody>
  </table>

  <dialog id="backup-dialog">
    <form method="dialog" id="backup-form">
      <h2>백업 복원</h2>
      <p>복원할 백업을 선택하세요. 복원 전에 현재 데이터도 자동으로 백업됩니다.</p>
      <div id="backup-list" class="backup-list"></div>
      <div class="dialog-actions">
        <button type="button" id="backup-open-folder">백업 폴더 열기</button>
        <button type="submit" value="cancel">취소</button>
        <button type="button" id="backup-restore-btn" disabled>복원</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
