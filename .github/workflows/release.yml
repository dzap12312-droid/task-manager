name: Release

# v* 태그를 push하면 Windows에서 테스트 → 빌드 → GitHub Release에 설치형·포터블 exe 첨부.
# 수동 실행(Actions 탭 → Release → Run workflow)도 가능:
#  - 입력한 태그가 이미 있으면 그 태그를 다시 빌드해 exe를 교체
#  - 태그가 없으면 선택한 브랜치의 최신 커밋을 빌드하고, 그 커밋에 태그와 Release를 만든다
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '다시 빌드할 태그 (예: v1.2.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag / version
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            git checkout -q "refs/tags/${TAG}"
          fi
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v${PKG_VERSION}" != "${TAG}" ]; then
            echo "package.json version(${PKG_VERSION})과 태그(${TAG})가 다릅니다."
            exit 1
          fi
          echo "빌드 대상: ${TAG} @ $(git rev-parse --short HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test

      - name: npm run dist
        run: npm run dist

      - name: Changed-files zip (since v1.1 upload)
        shell: bash
        run: |
          set -euo pipefail
          # 저장소 첫 커밋 = v1.1 원본 업로드. 그 뒤로 추가·변경된 파일만 묶는다.
          BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD > changed-files.txt
          git archive --format=zip -o "dist/TaskManager-${TAG#v}-changes-since-v1.1.zip" HEAD -- $(cat changed-files.txt)
          echo "$(wc -l < changed-files.txt) files"

      - name: List build output
        shell: bash
        run: ls -la dist

      # Release 업로드가 실패해도 이 실행 페이지(Artifacts)에서 exe를 받을 수 있게 먼저 보관
      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TaskManager-${{ env.TAG }}
          path: |
            dist/TaskManager-*.exe
            dist/TaskManager-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          shopt -s nullglob
          exes=(dist/TaskManager-*.exe)
          files=("${exes[@]}" dist/TaskManager-*.zip)
          if [ "${#exes[@]}" -lt 2 ]; then
            echo "설치형/포터블 exe를 찾지 못했습니다: ${exes[*]:-없음}"
            exit 1
          fi
          # README의 CHANGELOG에서 이 버전 항목만 뽑아 릴리스 노트로 사용
          awk -v head="### v${VERSION}" 'index($0, head) == 1 { f = 1; next } /^### / { f = 0 } /^## / { f = 0 } f' README.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "업무관리 ${TAG}" > release-notes.md; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --target "$TARGET_SHA" --title "업무관리 ${TAG}" --notes-file release-notes.md
          fi
          gh release view "$TAG"
